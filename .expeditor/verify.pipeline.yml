---
# This Buildkite pipeline has been migrated to GitHub Actions
# (.github/workflows/windows-verify.yml). It is kept as a no-op here
# because the Buildkite pipeline itself is registered externally and
# unconditionally invokes this file; deleting it breaks the build with
# ENOENT instead of retiring it. This file can be removed once a Chef
# sustaining-team member decommissions the Buildkite pipeline and
# removes it from required branch-protection checks.
expeditor:
  defaults:
    buildkite:
      timeout_in_minutes: 5

steps:
  - label: "no-op (migrated to GitHub Actions)"
    command:
      - echo "This pipeline has been migrated to GitHub Actions. See .github/workflows/windows-verify.yml"
    agents:
      queue: default-windows-2019-privileged
