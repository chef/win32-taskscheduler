---
name: windows verify

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-specs:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1.7", "3.4.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run Cookstyle
        run: |
          gem install cookstyle
          cookstyle --chefstyle -c .rubocop.yml

      - name: Run rake (style + spec)
        run: bundle exec rake
